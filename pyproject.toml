[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "catalog-identity-engine"
version = "0.1.0"
description = "Reproducible product matching across heterogeneous ecommerce listings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0,<3",
    "polars>=1.20,<2",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "httpx>=0.28,<1"]
models = ["lightgbm>=4.6,<5"]
semantic = ["sentence-transformers>=5,<6", "faiss-cpu>=1.10,<2"]
ann = ["faiss-cpu>=1.10,<2"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]

[project.scripts]
catalog-identity = "catalog_identity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
