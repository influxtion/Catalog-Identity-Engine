name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: python -m uv sync --locked --extra dev --extra models
      - run: python -m uv run ruff check .
      - run: python -m uv run ruff format --check .
      - run: python -m uv run pytest --cov=catalog_identity --cov-report=term-missing
      - run: python -m uv run catalog-identity demo --output runs/ci-demo
