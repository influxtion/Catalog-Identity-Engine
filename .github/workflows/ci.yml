name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: python -m uv sync --locked --extra dev --extra models --extra ann --extra server --extra benchmarks
      - run: python -m uv run ruff check .
      - run: python -m uv run ruff format --check .
      - run: python -m uv run pytest --cov=catalog_identity --cov-report=term-missing
      - run: python -m uv run catalog-identity demo --output runs/ci-demo

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog_test
          POSTGRES_DB: catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catalog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.13.7
      - run: python -m uv sync --locked --extra dev --extra server
      - run: python -m uv run pytest tests/test_api.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://catalog:catalog_test@localhost:5432/catalog

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.13.7
      - run: python -m uv sync --locked --extra server
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
